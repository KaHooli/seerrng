---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: 'PR Validation'

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - edited
      - synchronize

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  semantic-title:
    name: Validate PR Title
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
      issues: write
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        id: lint_pr_title
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        if: always() && steps.lint_pr_title.outputs.error_message != null
        env:
          ERROR_MESSAGE: ${{ steps.lint_pr_title.outputs.error_message }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const message = String(process.env.ERROR_MESSAGE ?? '')
              .replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f]/g, '')
              .replace(/@/g, '@\u200b')
              .slice(0, 4000);
            const prNumber = context.payload.pull_request.number;

            const body = [
              `### PR Title Validation Failed\n`,
              message,
              `\n---\n`,
              `PR titles must follow [Conventional Commits](https://www.conventionalcommits.org/en/v1.0.0/).`,
              `*This check will re-run when you update your PR title.*`,
            ].join('\n');

            const { data: allComments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
              page: 1,
            });

                const botComment = allComments.find(
                  c => c.user.type === 'Bot' && c.body && c.body.includes('### PR Title Validation Failed')
                );

                if (botComment) {
                  await github.rest.issues.updateComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    comment_id: botComment.id,
                    body,
                  });
                } else {
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: prNumber,
                    body,
                  });
                }

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        if: always() && steps.lint_pr_title.outputs.error_message == null
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.payload.pull_request.number;

            const { data: allComments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
              page: 1,
            });

            const botComment = allComments.find(
              c => c.user.type === 'Bot' && c.body && c.body.includes('### PR Title Validation Failed')
            );

            if (botComment) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
              });
            }
