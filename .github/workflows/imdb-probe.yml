name: IMDb profile ID probe
on:
  push:
    branches: ['probe/imdb-profile-id']
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe
        env:
          PID: p.mqcc26fvagqmqbomwbssqddwh4
          UA: 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0 Safari/537.36'
        run: |
          gql() {
            echo "=== GQL: $1"
            jq -n --arg q "$1" '{query:$q}' | curl -sS -m 20 -X POST https://api.graphql.imdb.com/ \
              -H 'content-type: application/json' -H 'x-imdb-client-name: imdb-web-next' \
              -H "user-agent: $UA" --data @- | head -c 4000; echo
          }
          gql "{ userProfile(input: { profileId: \"$PID\" }) { userId } }"
          gql "{ userProfile(input: { profileId: \"p.zzzzzzzzzzzzzzzzzzzzzzzzzz\" }) { userId } }"
          gql "{ userProfile(input: { profileId: \"ur31669188\" }) { userId } }"
          gql '{ list: predefinedList(classType: WATCH_LIST, userId: "ur31669188") { titleListItemSearch(first: 5, sort: { by: LIST_ORDER, order: ASC }) { total pageInfo { hasNextPage endCursor } edges { title { id titleText { text } } } } } }'
