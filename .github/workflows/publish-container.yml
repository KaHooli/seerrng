---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Publish Container

# ci.yml already publishes this image, but its build and publish jobs run on
# self-hosted runners labelled for the maintainer's build host. A fork without
# those runners cannot produce a container at all. This workflow publishes the
# same image to the repository's own GitHub Packages registry from a
# GitHub-hosted runner, using the automatic GITHUB_TOKEN, so no runner and no
# registry credentials have to be configured.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Let an in-flight publish finish rather than leaving main without an image.
  cancel-in-progress: false

jobs:
  publish:
    name: Publish container to GitHub Packages
    timeout-minutes: 60
    # The push trigger is already limited to main; this also stops a manual
    # dispatch from running the privileged publish against an arbitrary ref.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Commit timestamp
        id: ts
        run: echo "TIMESTAMP=$(git log -1 --pretty=%ct)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.ref_name }}
            type=sha
          labels: |
            org.opencontainers.image.created=${{ steps.ts.outputs.TIMESTAMP }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COMMIT_TAG=${{ github.sha }}
            BUILD_VERSION=${{ github.ref_name }}
            SOURCE_DATE_EPOCH=${{ steps.ts.outputs.TIMESTAMP }}
          cache-from: type=gha,scope=publish-container
          cache-to: type=gha,mode=max,scope=publish-container
          provenance: false

      - name: Summarise published image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          {
            echo "### Published container"
            echo
            while IFS= read -r tag; do
              [ -n "$tag" ] && echo "- \`${tag}\`"
            done <<< "$IMAGE_TAGS"
          } >> "$GITHUB_STEP_SUMMARY"
